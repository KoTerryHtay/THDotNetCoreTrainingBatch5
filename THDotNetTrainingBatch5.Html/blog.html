<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <link rel="stylesheet" href="bootstrap.min.css" />
  </head>
  <body style="background-color: #454545">
    <div class="mb-3">
      <label for="title" class="form-label">Title</label>
      <input type="text" class="form-control" id="txtTitle" />
    </div>
    <div class="mb-3">
      <label for="author" class="form-label">Author</label>
      <input type="text" class="form-control" id="txtAuthor" />
    </div>
    <div class="mb-3">
      <label for="content" class="form-label">Content</label>
      <input type="text" class="form-control" id="txtContent" />
    </div>
    <button type="button" id="btnCancel" class="btn btn-secondary">
      Cancel
    </button>
    <button type="button" id="btnSave" class="btn btn-success">Success</button>

    <table class="table table-responsive table-dark">
      <thead>
        <tr>
          <th></th>
          <th>No.</th>
          <th>Title</th>
          <th>Author</th>
          <th>Content</th>
        </tr>
      </thead>
      <tbody id="tblBlogs"></tbody>
    </table>

    <script src="jquery.min.js"></script>
    <script src="bootstrap.bundle.min.js"></script>
    <script>
      $("#btnCancel").click(function () {
        clearControls();
      });

      // Create
      $("#btnSave").click(function () {
        if (editId == null) {
          blogCreate();
        } else {
          blogUpdate();
        }
      });

      function blogCreate() {
        const title = $("#txtTitle").val();
        const author = $("#txtAuthor").val();
        const content = $("#txtContent").val();

        let lst = getData();

        const blog = { id: uuidv4(), title, author, content };
        lst.push(blog);

        const jsonStr = JSON.stringify(lst);
        localStorage.setItem("blogs", jsonStr);

        // clearControls();

        alert("Saved Successfully");

        loadData();
      }

      function blogUpdate() {
        const title = $("#txtTitle").val();
        const author = $("#txtAuthor").val();
        const content = $("#txtContent").val();

        let lst = getData();

        let index = lst.findIndex((x) => x.id == editId);
        lst[index].title = title;
        lst[index].author = author;
        lst[index].content = content;

        const jsonStr = JSON.stringify(lst);
        localStorage.setItem("blogs", jsonStr);

        clearControls();

        editId = null;

        alert("Updated successfully");

        loadData();
      }

      $(document).ready(function () {
        loadData();
      });

      // check exist data from localstorage
      function getData() {
        let lst = localStorage.getItem("blogs");
        if (lst == null) {
          lst = [];
        } else {
          lst = JSON.parse(lst);
        }

        return lst;
      }

      // Read
      function loadData() {
        let lst = getData();

        // let trs = "";
        $("#tblBlogs").html("");
        for (let i = 0; i < lst.length; i++) {
          const blog = lst[i];
          const tr = `
            <tr>
              <td>
                <button type="button" class="btn btn-warning btn-edit" data-blog-id="${blog.id}">Edit</button>
                <button type="button" class="btn btn-danger btn-delete" data-blog-id="${blog.id}">Delete</button>
              </td>
              <td>${i + 1}</td>
              <td>${blog.title}</td>
              <td>${blog.author}</td>
              <td>${blog.content}</td>
            </tr>
          `;
          console.log(tr);
          // trs += tr;
          $("#tblBlogs").append(tr);
        }
        // $("#tblBlogs").html(trs);

        bindEditButton();
        bindDeleteButton();
      }

      let editId = null;

      // Edit
      function bindEditButton() {
        $(".btn-edit").click(function () {
          let id = $(this).data("blog-id");
          console.log(id);
          let lst = getData();

          let filterList = lst.filter((x) => x.id == id);
          let item = filterList[0];
          console.log({ item });

          $("#txtTitle").val(item.title);
          $("#txtAuthor").val(item.author);
          $("#txtContent").val(item.content);

          editId = item.id;
        });
      }

      function bindDeleteButton() {
        $(".btn-delete").click(function () {
          let result = confirm("Are you sure to delete?");
          if (!result) return;

          let id = $(this).data("blog-id");

          let lst = getData();

          lst = lst.filter((x) => x.id != id);

          const jsonStr = JSON.stringify(lst);
          localStorage.setItem("blogs", jsonStr);

          clearControls();

          alert("Deleted successfully");

          loadData();
        });
      }

      function clearControls() {
        $("#txtTitle").val("");
        $("#txtAuthor").val("");
        $("#txtContent").val("");

        $("#txtTitle").focus();
      }

      function uuidv4() {
        return "10000000-1000-4000-8000-100000000000".replace(/[018]/g, (c) =>
          (
            +c ^
            (crypto.getRandomValues(new Uint8Array(1))[0] & (15 >> (+c / 4)))
          ).toString(16),
        );
      }
    </script>
  </body>
</html>
